[package]
name = "brightcone-people-plus"
version = "0.1.0"
edition = "2021"
default-run = "brightcone-people-plus"

[[bin]]
name = "brightcone-people-plus"
path = "src/bin/main.rs"

[[bin]]
name = "brightcone-schema"
path = "src/bin/schema.rs"

[dependencies]
loco-rs = { version = "=1.2.0", default-features = false, features = ["cli", "cache_inmem"] }
axum = { version = "0.8", features = ["macros"] }
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "json", "chrono", "uuid", "macros"] }
sea-orm = { version = "=2.0.4", default-features = false, features = ["sqlx-postgres", "runtime-tokio", "with-json", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = { version = "0.5", features = ["std"] }
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
regex = "1"
sha2 = "0.10"
hex = "0.4"
dotenvy = "0.15"
tracing = "0.1"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[profile.release]
strip = true
lto = "thin"
