name: Build native release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
      SQLX_OFFLINE: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm ci
      - name: Build the native deployment package
        run: npm run build:release
      - name: Archive the release
        run: tar -czf brightcone-people-plus-linux-x64.tar.gz -C dist brightcone
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: brightcone-people-plus-linux-x64
          path: brightcone-people-plus-linux-x64.tar.gz
          retention-days: 14
